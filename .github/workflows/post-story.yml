name: Post proof story

# Tue, Thu, Sun. GitHub often starts scheduled runs late (up to hours), so the job wakes five times a day.
# The first run at or after 16:00 UK time posts; the script then logs it and every later run that day
# sees "already posted" and stops. A run before 15:00 or after 23:00 UK time does nothing.
on:
  schedule:
    - cron: '37 14,15,16,17,18 * * 0,2,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (builds the story but does not publish)'
        type: boolean
        default: true
      date:
        description: 'Pretend it is this date (YYYY-MM-DD). Leave blank for today.'
        required: false

permissions:
  contents: write

concurrency:
  group: post-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post story
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_DATE: ${{ inputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          FLAGS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$DISPATCH_DRY_RUN" = "true" ] && FLAGS="$FLAGS --dry-run"
            [ -n "$DISPATCH_DATE" ] && FLAGS="$FLAGS --date $DISPATCH_DATE"
            FLAGS="$FLAGS --now"
          fi
          node post-story.js $FLAGS
      - name: Save posted log
        if: always()
        run: |
          if [ -n "$(git status --porcelain posted.json 2>/dev/null)" ]; then
            git config user.name "IGNYT story poster"
            git config user.email "actions@users.noreply.github.com"
            git add posted.json
            git commit -m "Log posted story"
            git push
          fi
